apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-configs
  namespace: monitoring
data:
  otel-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        timeout: 200ms
        send_batch_size: 512
      k8s_attributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.deployment.name
            - k8s.node.name
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.name
              - from: connection
      resource:
        attributes:
          - key: locus
            value: "k8s-collector"
            action: insert

    exporters:
      otlp_http/loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/otlp"
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
      otlp/tempo:
        endpoint: "tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      otlp/jaeger:
        endpoint: "jaeger.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      prometheus:
        endpoint: "0.0.0.0:9464"
      debug:
        verbosity: detailed

    service:
      telemetry:
        logs:
          level: "info"
      pipelines:
        traces:
          receivers: [otlp]
          processors: [k8s_attributes, batch]
          exporters: [otlp/jaeger, otlp/tempo, debug]
        metrics:
          receivers: [otlp]
          processors: [k8s_attributes, batch]
          exporters: [prometheus, debug]
        logs:
          receivers: [otlp]
          processors: [k8s_attributes, batch]
          exporters: [otlp_http/loki, debug]
