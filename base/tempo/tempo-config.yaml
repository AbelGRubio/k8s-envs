apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-configs
  namespace: monitoring
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318
    ingester:
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1
      max_block_duration: 5m
      max_block_bytes: 100_000
    compactor:
      compaction:
        block_retention: 24h
        compacted_block_retention: 1h
    storage:
      trace:
        backend: local
        block:
          bloom_filter_false_positive: .05
        wal:
          path: /tmp/tempo/wal
        local:
          path: /tmp/tempo/blocks
        pool:
          max_workers: 100
          queue_depth: 10000
    metrics_generator:
      registry:
        external_labels:
          source: tempo
      storage:
        path: /tmp/tempo/generator
      processor:
        span_metrics:
          dimensions:
            - service.name
    overrides:
      defaults:
        metrics_generator:
          processors: [span_metrics]
