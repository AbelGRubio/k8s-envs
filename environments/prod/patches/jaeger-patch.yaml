apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ingress
  namespace: monitoring
spec:
  rules:
    - host: jaeger.localhost
      http:
        paths:
          - path: ""
            pathType: ImplementationSpecific
            backend:
              service:
                name: jaeger-service
                port:
                  number: 16686
