apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: loki-ingress
  namespace: monitoring
spec:
  rules:
    - host: loki.localhost
      http:
        paths:
          - path: ""
            pathType: ImplementationSpecific
            backend:
              service:
                name: loki-service
                port:
                  number: 3100
