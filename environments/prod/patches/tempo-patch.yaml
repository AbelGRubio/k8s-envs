apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempo-ingress
  namespace: monitoring
spec:
  rules:
    - host: tempo.localhost
      http:
        paths:
          - path: ""
            pathType: ImplementationSpecific
            backend:
              service:
                name: tempo-service
                port:
                  number: 3200
